---
# Write S4 (in-cluster S3) credentials to Vault after ArgoCD bootstrap.
# The ExternalSecret in cluster/quay-secret/externalsecret.yaml reads
# secrets/s4 (ESO adds kv/data/ prefix for KV v2) to build quay-config-bundle.
#
# ORDERING: This runs AFTER wait_for_apps.yml so Vault is already deployed.
# VAULT PATH CONTRACT: secrets/s4 -> {access_key, secret_key}
# ESO refreshInterval is 30s — Quay picks up creds within 30s of this write.

- name: Wait for Vault pod to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ocp4_workload_dev_days_rdshw_vault_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=vault
  register: r_vault_pod
  retries: 30
  delay: 10
  until:
    - r_vault_pod.resources | length > 0
    - r_vault_pod.resources[0].status.phase == 'Running'
    - r_vault_pod.resources[0].status.containerStatuses[0].ready

- name: Assert S4 is healthy before writing credentials to Vault
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ ocp4_workload_s4_namespace | default('s4') }}"
    name: s4
  register: r_s4_deployment
  retries: 30
  delay: 10
  until:
    - r_s4_deployment.resources | length > 0
    - r_s4_deployment.resources[0].status.readyReplicas is defined
    - r_s4_deployment.resources[0].status.readyReplicas | int >= 1

- name: Write S4 credentials to Vault (kv/secrets/s4)
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_dev_days_rdshw_vault_namespace }}"
    pod: "{{ ocp4_workload_dev_days_rdshw_vault_name }}-0"
    command: >-
      vault kv put kv/secrets/s4
      access_key={{ ocp4_workload_dev_days_rdshw_vault_s4_access_key }}
      secret_key={{ ocp4_workload_dev_days_rdshw_vault_s4_secret_key }}
  register: r_vault_s4_write
  retries: 5
  delay: 10
  until: r_vault_s4_write.rc == 0

- name: Confirm S4 credentials written to Vault
  ansible.builtin.debug:
    msg: "S4 creds written to kv/secrets/s4. ESO will sync quay-config-bundle within 30s."
